version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - gosec
    - bodyclose
    - errorlint
    - misspell
    - unconvert
    - unparam
    - nolintlint
    - revive
    - funlen
    - gocognit
  settings:
    funlen:
      lines: 40
      statements: 30
    gocognit:
      min-complexity: 20
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    rules:
      - path: _test\.go
        linters: [funlen, gosec, unparam]
formatters:
  enable:
    - gofumpt
